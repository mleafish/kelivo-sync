name: Build Sync Server

# Compiles the sync server to a single Linux executable so it can be dropped
# onto a server without a Dart toolchain.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'server/**'
      - '.github/workflows/build-sync-server.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Sync server (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        working-directory: server
        run: dart pub get

      - name: Compile Linux executable
        working-directory: server
        run: |
          dart compile exe bin/kelivo_sync_server.dart \
            -o kelivo-sync-server-linux-x64

      - name: Smoke test (protocol, end to end)
        working-directory: server
        run: |
          chmod +x tool/smoke_test.sh
          tool/smoke_test.sh "$PWD/kelivo-sync-server-linux-x64"

      # Uploaded before the analyzer runs: a lint complaint should not cost the
      # artifact that the smoke test just proved works.
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: Kelivo-Sync-Server
          path: server/kelivo-sync-server-linux-x64
          if-no-files-found: error

      - name: Analyze
        working-directory: server
        run: dart analyze
